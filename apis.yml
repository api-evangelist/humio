aid: humio
name: Humio
description: >-
  Humio is a log management and observability platform built for ingesting,
  storing, and searching machine data in real time at scale. Backed by Accel and
  acquired by CrowdStrike in 2021, Humio is now delivered as CrowdStrike Falcon
  LogScale. It provides high-throughput streaming ingest (including Splunk HEC
  and Elastic bulk compatible endpoints), a live query language for dashboards
  and alerts, and index-free retention. Developers integrate through a REST API
  for ingest and search plus a GraphQL API for administration (repositories,
  parsers, users, ingest tokens), with official client libraries for Python,
  Node.js, Go, and JavaScript and the humioctl command-line client.
